name: Build VocalChain

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path configure.log -Pattern 'error' | Select-Object -First 8 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 8 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalChain-VST3-Windows
          path: build/VocalChain_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VocalChain-Standalone-Windows
          path: build/VocalChain_artefacts/Release/Standalone/
